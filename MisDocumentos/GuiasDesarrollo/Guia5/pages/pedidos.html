<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Nuevo pedido</h2>
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="idProducto" class="form-label">Producto</label>
                <input type="text" id="idProducto" class="form-control" required />
                <div class="invalid-feedback" id="errorProducto"></div>
              </div>
              <div class="col-md-3">
                <label for="idPrecio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="idPrecio" class="form-control" step="0.01" required />
                <div class="invalid-feedback" id="errorPrecio"></div>
              </div>
              <div class="col-md-2">
                <label for="idCantidad" class="form-label">Cantidad</label>
                <input type="number" id="idCantidad" class="form-control" step="1" required />
                <div class="invalid-feedback" id="errorCantidad"></div>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Agregar pedido</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="row g-2 mb-3 align-items-start">
            <div class="col-md-4">
              <input
                type="number"
                id="idPrecioMaximo"
                class="form-control"
                step="0.01"
                placeholder="Precio máximo ($)"
              />
              <div class="invalid-feedback" id="errorPrecioMaximo"></div>
            </div>
            <div class="col-auto">
              <button type="button" id="idBtnFiltrar" class="btn btn-secondary">Filtrar productos</button>
            </div>
            <div class="col-auto">
              <button type="button" id="idBtnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
            </div>
            <div class="col-auto ms-md-auto">
              <button type="button" id="idBtnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Precio unitario</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="idCuerpoTabla"></tbody>
            </table>
          </div>

          <div class="d-flex justify-content-end gap-4 mt-3 fw-bold">
            <span>Total de unidades: <span id="idTotalUnidades">0</span></span>
            <span>Monto total: $<span id="idMontoTotal">0.00</span></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
